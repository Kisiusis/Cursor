<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор печати</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; padding: 20px;
    display: flex; justify-content: center; align-items: flex-start;
  }
  .container {
    background: #fff; border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    width: 100%; max-width: 680px;
    padding: 30px; margin-top: 20px;
  }
  h1 { text-align: center; color: #333; margin-bottom: 25px; font-size: 24px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 25px; border-bottom: 2px solid #eee; }
  .tab {
    flex: 1; padding: 12px; background: none; border: none;
    font-size: 15px; cursor: pointer; color: #666; font-weight: 600;
    border-bottom: 3px solid transparent; transition: all 0.2s;
  }
  .tab.active { color: #667eea; border-bottom-color: #667eea; }
  .panel { display: none; }
  .panel.active { display: block; }

  .field { margin-bottom: 15px; }
  label { display: block; margin-bottom: 6px; color: #444; font-weight: 600; font-size: 14px; }
  input, select {
    width: 100%; padding: 12px 14px;
    border: 2px solid #e0e0e0; border-radius: 10px;
    font-size: 15px; outline: none; transition: border-color 0.2s;
  }
  input:focus, select:focus { border-color: #667eea; }

  /* Чекбокс резки */
  .checkbox-row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; background: #f8f9ff;
    border: 2px solid #e0e5f5; border-radius: 10px;
    cursor: pointer; user-select: none;
    transition: border-color 0.2s, background 0.2s;
    margin-bottom: 15px;
  }
  .checkbox-row:hover { border-color: #667eea; }
  .checkbox-row.checked { border-color: #667eea; background: #eef1ff; }
  .checkbox-row input[type="checkbox"] {
    width: 20px; height: 20px; margin: 0; padding: 0;
    accent-color: #667eea; cursor: pointer; flex-shrink: 0;
  }
  .cb-text { font-weight: 600; color: #333; font-size: 15px; }
  .cb-hint { font-size: 12px; color: #888; margin-top: 2px; }

  /* Строки размеров */
  .calc-rows { display: flex; flex-direction: column; gap: 6px; }
  .calc-row {
    display: grid;
    grid-template-columns: 32px 1fr 18px 1fr 100px;
    gap: 8px; align-items: center;
    padding: 6px 10px;
    border: 2px solid #e8ebf5;
    border-radius: 10px;
    transition: border-color 0.15s, background 0.15s;
  }
  .calc-row.header {
    background: transparent; border: none;
    padding: 4px 10px; font-size: 12px;
    color: #8891b5; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.3px;
  }
  .calc-row.has-data {
    border-color: #a5b0ff; background: #f8f9ff;
  }
  .calc-row .row-num {
    font-size: 12px; font-weight: 700;
    color: #8891b5; text-align: center;
  }
  .calc-row .x {
    font-size: 13px; color: #8891b5; text-align: center;
  }
  .calc-row input {
    padding: 8px 10px; font-size: 14px;
    border-width: 1.5px; border-radius: 8px;
  }
  .calc-row .row-result {
    font-size: 13px; font-weight: 700;
    color: #667eea; text-align: right;
    white-space: nowrap;
  }

  .clear-btn {
    width: 100%; padding: 10px;
    background: transparent; border: 2px dashed #d0d5e8;
    color: #8891b5; border-radius: 10px;
    cursor: pointer; font-weight: 600;
    font-size: 13px; margin-top: 10px;
    transition: all 0.15s;
  }
  .clear-btn:hover { border-color: #ff4757; color: #ff4757; }

  /* Переключатель суммы */
  .sum-toggle {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; background: #f8f9ff;
    border: 2px solid #e0e5f5; border-radius: 12px;
    margin: 15px 0; font-weight: 600;
    color: #333; cursor: pointer; user-select: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .sum-toggle:hover { border-color: #667eea; }
  .sum-toggle.checked { border-color: #667eea; background: #eef1ff; }
  .sum-toggle .txt { flex: 1; font-size: 15px; }
  .switch {
    position: relative; display: inline-block;
    width: 44px; height: 24px; flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: #ccc; border-radius: 24px; transition: 0.3s;
  }
  .slider::before {
    content: ""; position: absolute;
    height: 18px; width: 18px; left: 3px; bottom: 3px;
    background: white; border-radius: 50%; transition: 0.3s;
  }
  .switch input:checked + .slider { background: #667eea; }
  .switch input:checked + .slider::before { transform: translateX(20px); }

  /* Результат */
  .result {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white; padding: 25px; border-radius: 12px;
    margin-top: 15px; text-align: center;
  }
  .result .label { font-size: 14px; opacity: 0.9; margin-bottom: 8px; }
  .result .price { font-size: 38px; font-weight: bold; letter-spacing: 1px; }
  .result .breakdown {
    margin-top: 15px; padding-top: 15px;
    border-top: 1px solid rgba(255,255,255,0.25);
    font-size: 14px; text-align: left;
    display: flex; flex-direction: column; gap: 6px;
  }
  .result .row-line {
    display: flex; justify-content: space-between; gap: 10px;
  }
  .result .row-line span:last-child { font-weight: 700; white-space: nowrap; }

  /* Админ */
  .admin-section {
    background: #f8f9ff; border: 1px solid #e0e5f5;
    border-radius: 12px; padding: 15px; margin-bottom: 20px;
  }
  .admin-section h4 { margin-bottom: 12px; color: #333; font-size: 15px; }
  .admin-section .field { margin-bottom: 0; }
  .admin-card {
    background: #f8f9ff; border: 1px solid #e0e5f5;
    border-radius: 12px; padding: 15px; margin-bottom: 12px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .admin-card input { width: 130px; padding: 8px 10px; font-size: 14px; }
  .admin-card input[data-field="name"] { flex: 1; min-width: 130px; }
  .admin-card .del-btn {
    background: #ff4757; color: #fff; border: none;
    border-radius: 8px; padding: 8px 14px;
    cursor: pointer; font-weight: 700; font-size: 15px;
  }
  .admin-card .del-btn:hover { background: #e63946; }

  .login-box { text-align: center; padding: 40px 20px; }
  .login-box p { color: #666; margin-bottom: 15px; }
  .login-box input { max-width: 250px; margin: 0 auto 15px auto; display: block; text-align: center; }
  .login-box button {
    padding: 10px 30px; background: #667eea; color: white;
    border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 15px;
  }
  .hint { font-size: 12px; color: #888; margin-top: 8px; }
  .add-material-btn {
    width: 100%; padding: 12px; background: #fff;
    border: 2px dashed #667eea; color: #667eea;
    border-radius: 10px; cursor: pointer; font-weight: 600; margin-top: 10px;
  }
  .add-material-btn:hover { background: #f0f2ff; }
  .action {
    width: 100%; padding: 15px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white; border: none; border-radius: 10px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    margin-top: 15px;
  }
  .action:hover { filter: brightness(1.05); }
  .logout-btn {
    width: 100%; padding: 10px; background: #eee;
    border: none; border-radius: 8px; margin-top: 10px;
    cursor: pointer; color: #666;
  }

  /* Модалка и тост */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: #fff; border-radius: 14px;
    padding: 25px; max-width: 380px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center;
  }
  .modal-box p { font-size: 16px; color: #333; margin-bottom: 20px; line-height: 1.4; }
  .modal-buttons { display: flex; gap: 10px; }
  .modal-buttons button {
    flex: 1; padding: 12px; border: none;
    border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  #confirm-yes { background: #ff4757; color: #fff; }
  #confirm-no { background: #eee; color: #444; }

  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #2ecc71; color: white;
    padding: 12px 24px; border-radius: 10px;
    font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    opacity: 0; transition: all 0.3s; z-index: 2000;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.error { background: #e74c3c; }

  @media (max-width: 480px) {
    .container { padding: 20px; }
    .calc-row { grid-template-columns: 26px 1fr 14px 1fr 76px; gap: 5px; padding: 6px 8px; }
    .calc-row input { padding: 6px 8px; font-size: 13px; }
    .calc-row .row-result { font-size: 12px; }
    .calc-row.header { padding: 4px 8px; font-size: 10px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🖨️ Калькулятор печати</h1>

  <div class="tabs">
    <button class="tab active" data-tab="calc" type="button">Калькулятор</button>
    <button class="tab" data-tab="admin" type="button">⚙️ Админ</button>
  </div>

  <!-- КАЛЬКУЛЯТОР -->
  <div class="panel active" id="panel-calc">
    <div class="field">
      <label>Материал</label>
      <select id="material"></select>
    </div>

    <label class="checkbox-row" id="cut-checkbox-label">
      <input type="checkbox" id="cut-enabled">
      <div>
        <div class="cb-text">✂️ Резка по изображению (контуру)</div>
        <div class="cb-hint" id="cut-hint">Считается по периметру: 2 × (Ш + В)</div>
      </div>
    </label>

    <div class="field">
      <label>Размеры (см)</label>
      <div class="calc-rows" id="rows-container"></div>
      <button class="clear-btn" id="clear-btn" type="button">Очистить все строки</button>
    </div>

    <label class="sum-toggle" id="sum-toggle-label">
      <span class="txt">Σ Суммировать результат</span>
      <span class="switch">
        <input type="checkbox" id="sum-enabled" checked>
        <span class="slider"></span>
      </span>
    </label>

    <div class="result" id="result" style="display:none;">
      <div class="label" id="result-label">Итого</div>
      <div class="price" id="price">0 ₽</div>
      <div class="breakdown" id="breakdown"></div>
    </div>
  </div>

  <!-- АДМИН -->
  <div class="panel" id="panel-admin">
    <div id="admin-login" class="login-box">
      <p>🔒 Введите пароль для доступа к настройкам</p>
      <input type="password" id="admin-pass" placeholder="Пароль" autocomplete="off">
      <button id="login-btn" type="button">Войти</button>
      <div class="hint">Пароль по умолчанию: <b>admin</b></div>
    </div>

    <div id="admin-content" style="display:none;">
      <div class="admin-section">
        <h4>⚙️ Общие настройки</h4>
        <div class="field">
          <label>Резка по контуру (₽ / погонный метр)</label>
          <input type="number" id="cut-price-input" min="0" step="1" placeholder="например, 150">
          <div class="hint">В калькуляторе: периметр (м) × эту цену</div>
        </div>
      </div>

      <h3 style="margin-bottom:15px;color:#333;">Материалы и цены за м²</h3>
      <div id="materials-list"></div>
      <button class="add-material-btn" id="add-mat-btn" type="button">+ Добавить материал</button>
      <button class="action" id="save-btn" type="button">💾 Сохранить</button>
      <button class="logout-btn" id="logout-btn" type="button">Выйти</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirm-modal">
  <div class="modal-box">
    <p id="confirm-text"></p>
    <div class="modal-buttons">
      <button id="confirm-yes" type="button">Удалить</button>
      <button id="confirm-no" type="button">Отмена</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var ADMIN_PASSWORD = 'admin';
var ROWS_COUNT = 10;

var DEFAULT_MATERIALS = [
  { name: 'Баннерная ткань', price: 350 },
  { name: 'Самоклеющаяся плёнка', price: 500 },
  { name: 'Винил', price: 450 },
  { name: 'Холст', price: 800 },
  { name: 'Фотобумага', price: 600 },
  { name: 'Пенокартон', price: 700 }
];

var DEFAULT_SETTINGS = { cutPrice: 150 };

var materials = [];
var settings = {};
var pendingDeleteIdx = -1;
var toastTimer = null;

/* ---------- Утилиты ---------- */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function showToast(msg, isError) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2500);
}
function plural(n, forms) {
  var n10 = n % 10, n100 = n % 100;
  if (n10 === 1 && n100 !== 11) return forms[0];
  if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return forms[1];
  return forms[2];
}

/* ---------- Хранилище ---------- */
function loadMaterials() {
  try {
    var s = localStorage.getItem('printMaterials');
    if (s) { var p = JSON.parse(s); if (Array.isArray(p)) return p; }
  } catch (e) { console.warn('load materials:', e); }
  return JSON.parse(JSON.stringify(DEFAULT_MATERIALS));
}
function saveMaterials() {
  try { localStorage.setItem('printMaterials', JSON.stringify(materials)); return true; }
  catch (e) { showToast('Ошибка сохранения материалов', true); return false; }
}
function loadSettings() {
  try {
    var s = localStorage.getItem('printSettings');
    if (s) {
      var p = JSON.parse(s);
      if (p && typeof p === 'object') {
        return { cutPrice: (typeof p.cutPrice === 'number' && p.cutPrice >= 0) ? p.cutPrice : DEFAULT_SETTINGS.cutPrice };
      }
    }
  } catch (e) { console.warn('load settings:', e); }
  return JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
}
function saveSettings() {
  try { localStorage.setItem('printSettings', JSON.stringify(settings)); return true; }
  catch (e) { showToast('Ошибка сохранения настроек', true); return false; }
}

/* ---------- Вкладки ---------- */
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) {
    t.classList.toggle('active', t.dataset.tab === name);
  });
  document.querySelectorAll('.panel').forEach(function(p) {
    p.classList.toggle('active', p.id === 'panel-' + name);
  });
}

/* ---------- Строки калькулятора ---------- */
function buildRows() {
  var container = document.getElementById('rows-container');
  var html = '<div class="calc-row header">' +
    '<span>#</span><span>Ширина</span><span></span><span>Высота</span>' +
    '<span style="text-align:right;">Стоимость</span></div>';

  for (var i = 0; i < ROWS_COUNT; i++) {
    html += '<div class="calc-row" data-row="' + i + '">' +
      '<span class="row-num">' + (i + 1) + '</span>' +
      '<input type="number" class="w-input" min="0" step="0.1" placeholder="см" inputmode="decimal">' +
      '<span class="x">×</span>' +
      '<input type="number" class="h-input" min="0" step="0.1" placeholder="см" inputmode="decimal">' +
      '<span class="row-result">—</span>' +
      '</div>';
  }
  container.innerHTML = html;

  container.querySelectorAll('input').forEach(function(inp) {
    inp.addEventListener('input', calculateAll);
  });
}

function renderMaterialSelect() {
  var sel = document.getElementById('material');
  if (materials.length === 0) {
    sel.innerHTML = '<option value="">— Нет материалов —</option>';
    return;
  }
  sel.innerHTML = materials.map(function(m, i) {
    return '<option value="' + i + '">' + escapeHtml(m.name) + ' — ' + m.price + ' ₽/м²</option>';
  }).join('');
}

function updateCutHint() {
  var cb = document.getElementById('cut-enabled');
  var label = document.getElementById('cut-checkbox-label');
  label.classList.toggle('checked', cb.checked);
  var hint = document.getElementById('cut-hint');
  if (settings.cutPrice > 0) {
    hint.textContent = 'Цена: ' + settings.cutPrice + ' ₽/пог.м • 2 × (Ш + В)';
  } else {
    hint.textContent = '⚠️ Цена резки не задана (укажите в админ-панели)';
  }
}

/* ---------- Расчёт ---------- */
function calculateAll() {
  var idx = parseInt(document.getElementById('material').value, 10);
  var matPrice = materials[idx] ? materials[idx].price : 0;
  var withCut = document.getElementById('cut-enabled').checked;
  var cutPrice = settings.cutPrice;

  var results = [];
  var rows = document.querySelectorAll('.calc-row:not(.header)');

  rows.forEach(function(row, i) {
    var wEl = row.querySelector('.w-input');
    var hEl = row.querySelector('.h-input');
    var resEl = row.querySelector('.row-result');
    var w = parseFloat(wEl.value);
    var h = parseFloat(hEl.value);

    if (!w || !h || w <= 0 || h <= 0 || !materials[idx]) {
      resEl.textContent = '—';
      row.classList.remove('has-data');
      return;
    }

    var area = (w / 100) * (h / 100);
    var matCost = area * matPrice;
    var perimeter = 2 * (w + h) / 100;
    var cutCost = withCut ? perimeter * cutPrice : 0;
    var total = matCost + cutCost;

    results.push({
      num: i + 1, w: w, h: h,
      area: area, matCost: matCost,
      perimeter: perimeter, cutCost: cutCost, total: total
    });

    resEl.textContent = total.toFixed(2) + ' ₽';
    row.classList.add('has-data');
  });

  renderResult(results, withCut);
}

function renderResult(results, withCut) {
  var resultBox = document.getElementById('result');
  var sumEnabled = document.getElementById('sum-enabled').checked;

  if (results.length === 0 || !sumEnabled) {
    resultBox.style.display = 'none';
    return;
  }
  resultBox.style.display = 'block';

  var grandTotal = results.reduce(function(s, r) { return s + r.total; }, 0);
  var materialSum = results.reduce(function(s, r) { return s + r.matCost; }, 0);
  var cutSum = results.reduce(function(s, r) { return s + r.cutCost; }, 0);

  document.getElementById('price').textContent = grandTotal.toFixed(2) + ' ₽';
  document.getElementById('result-label').textContent =
    'Итого (' + results.length + ' ' +
    plural(results.length, ['позиция', 'позиции', 'позиций']) + ')';

  var html = '';

  // Разбивка по строкам
  results.forEach(function(r) {
    var detail = '№' + r.num + ': ' + r.w + '×' + r.h + ' см (' + r.area.toFixed(3) + ' м²';
    if (withCut) detail += ' + ' + r.perimeter.toFixed(2) + ' пог.м';
    detail += ')';
    html += '<div class="row-line"><span>' + detail + '</span>' +
      '<span>' + r.total.toFixed(2) + ' ₽</span></div>';
  });

  // Сводка
  html += '<div class="row-line" style="margin-top:8px;padding-top:8px;border-top:1px dashed rgba(255,255,255,0.3);opacity:0.95;">' +
    '<span>Материал всего</span><span>' + materialSum.toFixed(2) + ' ₽</span></div>';
  if (withCut && cutSum > 0) {
    html += '<div class="row-line" style="opacity:0.95;">' +
      '<span>✂️ Резка всего</span><span>' + cutSum.toFixed(2) + ' ₽</span></div>';
  }

  document.getElementById('breakdown').innerHTML = html;
}

/* ---------- Очистка ---------- */
function clearAllRows() {
  document.querySelectorAll('.calc-row:not(.header) input').forEach(function(inp) {
    inp.value = '';
  });
  calculateAll();
  showToast('Строки очищены');
}

/* ---------- Админ ---------- */
function login() {
  var inp = document.getElementById('admin-pass');
  if (inp.value.trim() === ADMIN_PASSWORD) {
    document.getElementById('admin-login').style.display = 'none';
    document.getElementById('admin-content').style.display = 'block';
    renderAdmin();
  } else {
    showToast('Неверный пароль. Введите: admin', true);
    inp.value = ''; inp.focus();
  }
}
function logout() {
  document.getElementById('admin-pass').value = '';
  document.getElementById('admin-login').style.display = 'block';
  document.getElementById('admin-content').style.display = 'none';
}

function renderAdmin() {
  document.getElementById('cut-price-input').value = settings.cutPrice;
  var list = document.getElementById('materials-list');
  if (materials.length === 0) {
    list.innerHTML = '<p style="color:#888;text-align:center;padding:20px;">' +
      'Нет материалов. Нажмите «Добавить материал».</p>';
    return;
  }
  list.innerHTML = materials.map(function(m, i) {
    return '<div class="admin-card">' +
      '<input type="text" value="' + escapeHtml(m.name) + '" data-idx="' + i + '" data-field="name">' +
      '<input type="number" value="' + m.price + '" min="0" step="1" data-idx="' + i + '" data-field="price">' +
      '<span style="color:#888;font-size:13px;">₽/м²</span>' +
      '<button class="del-btn" data-del="' + i + '" type="button" title="Удалить">✕</button>' +
    '</div>';
  }).join('');
}

function askDelete(idx) {
  if (!materials[idx]) return;
  pendingDeleteIdx = idx;
  document.getElementById('confirm-text').innerHTML =
    'Удалить материал<br><b>«' + escapeHtml(materials[idx].name) + '»</b>?';
  document.getElementById('confirm-modal').classList.add('show');
}
function cancelDelete() {
  pendingDeleteIdx = -1;
  document.getElementById('confirm-modal').classList.remove('show');
}
function confirmDelete() {
  if (pendingDeleteIdx < 0) return;
  var idx = pendingDeleteIdx;
  var name = materials[idx] ? materials[idx].name : 'материал';
  materials.splice(idx, 1);
  saveMaterials();
  renderAdmin();
  renderMaterialSelect();
  calculateAll();
  cancelDelete();
  showToast('Удалено: ' + name);
}

/* ---------- Инициализация ---------- */
function init() {
  materials = loadMaterials();
  settings = loadSettings();

  document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() { switchTab(tab.dataset.tab); });
  });

  buildRows();
  renderMaterialSelect();
  updateCutHint();

  // Калькулятор — пересчёт при любом изменении
  document.getElementById('material').addEventListener('change', calculateAll);
  document.getElementById('cut-enabled').addEventListener('change', function() {
    updateCutHint();
    calculateAll();
  });
  document.getElementById('clear-btn').addEventListener('click', clearAllRows);

  // Переключатель суммы
  var sumCb = document.getElementById('sum-enabled');
  var sumLabel = document.getElementById('sum-toggle-label');
  function syncSumLabel() {
    sumLabel.classList.toggle('checked', sumCb.checked);
  }
  sumCb.addEventListener('change', function() {
    syncSumLabel();
    calculateAll();
  });
  sumLabel.addEventListener('click', function(e) {
    if (e.target !== sumCb && !e.target.classList.contains('slider')) {
      e.preventDefault();
      sumCb.checked = !sumCb.checked;
      syncSumLabel();
      calculateAll();
    }
  });
  syncSumLabel();

  // Админ
  document.getElementById('login-btn').addEventListener('click', login);
  document.getElementById('admin-pass').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); login(); }
  });
  document.getElementById('logout-btn').addEventListener('click', logout);
  document.getElementById('cut-price-input').addEventListener('input', function() {
    settings.cutPrice = Math.max(0, parseFloat(this.value) || 0);
    updateCutHint();
  });
  document.getElementById('add-mat-btn').addEventListener('click', function() {
    materials.push({ name: 'Новый материал', price: 100 });
    saveMaterials(); renderAdmin(); renderMaterialSelect();
    showToast('Материал добавлен');
  });
  document.getElementById('save-btn').addEventListener('click', function() {
    var ok1 = saveMaterials();
    var ok2 = saveSettings();
    if (ok1 && ok2) {
      renderMaterialSelect();
      updateCutHint();
      calculateAll();
      showToast('✅ Сохранено');
    }
  });

  // Делегирование для списка материалов
  var list = document.getElementById('materials-list');
  list.addEventListener('input', function(e) {
    var inp = e.target;
    if (!inp.dataset || inp.dataset.idx === undefined) return;
    var i = parseInt(inp.dataset.idx, 10);
    if (!materials[i]) return;
    if (inp.dataset.field === 'name') materials[i].name = inp.value;
    else if (inp.dataset.field === 'price')
      materials[i].price = Math.max(0, parseFloat(inp.value) || 0);
  });
  list.addEventListener('click', function(e) {
    var btn = e.target.closest('[data-del]');
    if (!btn || !list.contains(btn)) return;
    e.preventDefault();
    var i = parseInt(btn.dataset.del, 10);
    if (!isNaN(i)) askDelete(i);
  });

  // Модалка
  document.getElementById('confirm-yes').addEventListener('click', confirmDelete);
  document.getElementById('confirm-no').addEventListener('click', cancelDelete);
  document.getElementById('confirm-modal').addEventListener('click', function(e) {
    if (e.target === this) cancelDelete();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') cancelDelete();
  });

  console.log('[init] Строк:', ROWS_COUNT,
              '| материалов:', materials.length,
              '| цена резки:', settings.cutPrice, '₽/пог.м');
}

init();
</script>
</body>
</html>
