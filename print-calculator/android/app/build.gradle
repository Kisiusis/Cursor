plugins {
    id "com.android.application"
}

android {
    namespace "ru.print.calculator"
    compileSdk 35

    defaultConfig {
        applicationId "ru.print.calculator"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}

tasks.register("copyWeb", Copy) {
    from "${rootDir}/../index.html"
    into "src/main/assets"
    from("${rootDir}/../vendor") {
        into "vendor"
    }
}

tasks.named("preBuild").configure {
    dependsOn "copyWeb"
}
